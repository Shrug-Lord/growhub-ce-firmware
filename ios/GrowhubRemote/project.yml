name: GrowhubRemote
options:
  bundleIdPrefix: com.landonlasseter
  deploymentTarget:
    iOS: '17.0'
packages:
  GrowhubCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: 6
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  GrowhubRemote:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GrowhubCore
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDisplayName: Growhub Remote
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Find and control your Growhub controllers on your Wi-Fi network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices: ['_http._tcp.']
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deep6.growhubremote

  GrowhubRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GrowhubRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deep6.growhubremote.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrowhubRemote:
    build:
      targets:
        GrowhubRemote: all
        GrowhubRemoteUITests: [test]
    test:
      targets: [GrowhubRemoteUITests]
