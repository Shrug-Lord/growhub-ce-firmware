name: PR build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Cache PlatformIO core + toolchains
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build CE firmware and verify first-flash package
        run: PIO_BIN=pio scripts/build-verified-firmware.sh

      - name: Verify frozen release hashes when present
        run: |
          set -euo pipefail
          fw_version="$(sed -nE 's/^[[:space:]]*-DGROWHUB_VERSION=\"([^\"]+)\"/\1/p' firmware/platformio.ini)"
          version="v${fw_version#v}"
          manifest="$GITHUB_WORKSPACE/release-manifests/$version.sha256"
          if [ -f "$manifest" ]; then
            cd "dist/growhub-ce-$version"
            sha256sum --check "$manifest"
          fi

      - name: Report binary size
        working-directory: firmware
        run: |
          ls -lh .pio/build/growhub/firmware.bin
          pio run --target size

      - name: Retain verified release candidate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: growhub-ce-${{ github.sha }}
          path: dist/growhub-ce-v*/
          if-no-files-found: error
          retention-days: 7
